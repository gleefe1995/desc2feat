[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desc2feat"
version = "0.1.0"
description = "Experimental jointly learned sparse-to-dense feature matching"
requires-python = ">=3.9"
dependencies = ["torch>=2.4", "numpy>=1.23", "Pillow>=9"]

[project.optional-dependencies]
data = ["h5py>=3", "opencv-python>=4.5", "PyYAML>=6"]
train = ["h5py>=3", "PyYAML>=6"]
eval = ["opencv-python>=4.5"]

[tool.setuptools.packages.find]
include = ["desc2feat*"]

[tool.setuptools.package-data]
"desc2feat.vendor" = ["*.LICENSE"]
